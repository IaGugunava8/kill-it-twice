name: kill-it-twice

x-backend-service: &backend-service
  image: kill-it-twice-backend:local
  init: true
  restart: unless-stopped
  networks: [replication]

x-application-environment: &application-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-optio}:${POSTGRES_PASSWORD:-optio-local}@postgres:5432/${POSTGRES_DB:-optio}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-optio}:${RABBITMQ_PASSWORD:-optio-local}@rabbitmq:5672
  ELASTICSEARCH_URL: http://elasticsearch:9200

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optio}
      POSTGRES_USER: ${POSTGRES_USER:-optio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optio-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [replication]

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-optio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-optio-local}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    networks: [replication]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped
    networks: [replication]

  api:
    <<: *backend-service
    build:
      context: ../kill-it-twice-backend
      dockerfile: Dockerfile
    command: ["node", "dist/apps/api/main.js"]
    environment:
      <<: *application-environment
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend-service
    command: ["node", "dist/apps/worker/main.js"]
    environment:
      <<: *application-environment
      PORT: 3001
    ports:
      - "127.0.0.1:${WORKER_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  consumer:
    <<: *backend-service
    command: ["node", "dist/apps/consumer/main.js"]
    environment:
      <<: *application-environment
      PORT: 3002
    ports:
      - "127.0.0.1:${CONSUMER_PORT:-3002}:3002"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    image: kill-it-twice-frontend:local
    build:
      context: ../kill-it-twice-frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [replication]

networks:
  replication:

volumes:
  postgres-data:
  rabbitmq-data:
  elasticsearch-data:
